    <style>
        /* Estilos para centrar todo en la pantalla */
        .big-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }
        a {
            display: inline-flex;
            align-items: center;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        a i {
            margin-right: 8px; /* Espacio entre el icono y el texto */
            font-size: 18px;
        }
        a:hover {
            background-color: #1ebc5e;
            color: white;
            text-decoration: none;
            transform: scale(1.03);
        }
    </style>
    <script>
        let seconds = 3; // Tiempo de espera en segundos

        // Define aquí tu enlace personalizado único
        const urlDestino = "http://yux.fi/Multydrink";

        let yaRedirigido = false;

        // Registra el evento Contact (Meta) y un evento en GoatCounter, y luego redirige
        function irAlDestino() {
            if (yaRedirigido) return;
            yaRedirigido = true;

            try { if (window.fbq) fbq('track', 'Contact'); } catch (e) {}
            try {
                if (window.goatcounter && window.goatcounter.count) {
                    window.goatcounter.count({ path: 'contacto-multydrink-yuxfi', title: 'Contacto Multydrink (yux.fi)', event: true });
                }
            } catch (e) {}

            // Pequeña espera para que los eventos alcancen a enviarse antes de salir
            setTimeout(function() { window.location.href = urlDestino; }, 400);
        }

        function updateCountdown() {
            document.getElementById("countdown").innerText = seconds;
            if (seconds > 0) {
                seconds--;
                setTimeout(updateCountdown, 1000); // Llamar cada segundo
            } else {
                irAlDestino();
            }
        }

        window.onload = function() {
            // Asignar el enlace directamente al botón al cargar
            var btn = document.getElementById("BtnWh");
            btn.href = urlDestino;
            btn.addEventListener("click", function(e) {
                e.preventDefault();
                irAlDestino();
            });
            updateCountdown(); // Iniciar cuenta regresiva al cargar la página
        };
    </script>
    <!-- Meta Pixel Code El Universal -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1778254566808591');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1778254566808591&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code El Universal -->
</head>
<body>
    <div class="big-container">
        <div class="container">
            <h2>Redirigiendo a WhatsApp en <span id="countdown">3</span> segundos...</h2>
            <p>Si la redirección no ocurre automáticamente, haz clic en el botón.</p>
            <a id="BtnWh" href="#">
                <i class="fa-brands fa-whatsapp"></i> Ir a WhatsApp
            </a>
        </div>
    </div>
  <!-- Aquí termina el contenido de tu página -->

  <!-- Estadísticas de GoatCounter -->
  <script
    data-goatcounter="https://audienciaseluniversal.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"
  ></script>
</body>
