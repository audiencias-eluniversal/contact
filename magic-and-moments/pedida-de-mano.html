    <style>
        /* Estilos para centrar todo en la pantalla */
        .big-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }
        a {
            display: inline-flex;
            align-items: center;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        a i {
            margin-right: 8px; /* Espacio entre el icono y el texto */
            font-size: 18px;
        }
        a:hover {
            background-color: #1ebc5e;
            color: white;
            text-decoration: none;
            transform: scale(1.03);
        }
    </style>
    <script>
        let seconds = 3; // Tiempo de espera en segundos
        
        // Define aquí tu enlace personalizado único
        const urlDestino = "https://yux.fi/Pedida-de-mano";

        function updateCountdown() {
            document.getElementById("countdown").innerText = seconds;
            if (seconds > 0) {
                seconds--;
                setTimeout(updateCountdown, 1000); // Llamar cada segundo
            } else {
                window.location.href = urlDestino;
            }
        }

        window.onload = function() {
            // Asignar el enlace directamente al botón al cargar
            document.getElementById("BtnWh").href = urlDestino;
            updateCountdown(); // Iniciar cuenta regresiva al cargar la página
        };
    </script>
</head>
<body>
    <div class="big-container">
        <div class="container">
            <h2>Redirigiendo a WhatsApp en <span id="countdown">3</span> segundos...</h2>
            <p>Si la redirección no ocurre automáticamente, haz clic en el botón.</p>
            <a id="BtnWh" href="#">
                <i class="fa-brands fa-whatsapp"></i> Ir a WhatsApp
            </a>
        </div>
    </div>
